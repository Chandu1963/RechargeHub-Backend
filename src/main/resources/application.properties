spring.application.name=RechargeHub

# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rechargehub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# SERVER
# ===============================

server.port=${PORT:8081}

# ===============================
# JWT CONFIGURATION
# ===============================

jwt.secret=${JWT_SECRET:MyRechargeHubSecretKeyForJwtAuthentication2026MyRechargeHubSecretKey}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ===============================
# GMAIL SMTP CONFIGURATION (100% UNRESTRICTED EMAIL DELIVERY)
# ===============================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=edubillichandu768@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:eqjhotwrpdbxfzwg}

spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Fast 5s timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# LOGGING
# ===============================

logging.level.org.springframework.mail=INFO
logging.level.org.eclipse.angus.mail=INFO

